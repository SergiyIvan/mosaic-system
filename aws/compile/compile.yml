---
- name: Compile and Upload Artifacts
  hosts: all
  become: yes # Run as root for installations.
  strategy: free
  vars:
    repo_url: "github.com/SergiyIvan/mosaic-system.git"
    repo_dir: "/home/ubuntu/mosaic-system"

  tasks:
    - name: Install dependencies
      apt:
        name:
          - git
          - build-essential
          - curl
          - awscli
          - nasm
          - pkg-config
          - zlib1g-dev
          - libx264-dev
        state: present
        update_cache: yes

- name: Setup User Space and Compile
  hosts: all
  become: no
  strategy: free
  vars:
    repo_dir: "/home/ubuntu/mosaic-system"
    # Passed in via the wrapper script.
    s3_bucket: "{{ target_bucket }}"
    target_benchmarks: "{{ target_benchmarks | default('') }}"

  tasks:

    - name: Clone private repository
      git:
        repo: "https://{{ repo_url }}"
        dest: "{{ repo_dir }}"
        force: yes

    - name: Execute FFmpeg compilation script
      shell: |
        bash compile-ffmpeg.sh "{{ configs }}" "{{ s3_bucket }}" "{{ inventory_hostname }}"
      args:
        chdir: "{{ repo_dir }}/aws/compile"
        executable: /bin/bash
