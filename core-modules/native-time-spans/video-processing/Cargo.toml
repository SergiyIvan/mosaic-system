[package]
name = "video-processing"
version = "0.1.0"
edition = "2021"
description = """
SeBS Video Processing
"""

[lib]
name = "video_processing"
crate-type = ["rlib", "cdylib"]

[dependencies]
ureq = "3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proxy-guest = { path = "../../shared/proxy-guest" }
