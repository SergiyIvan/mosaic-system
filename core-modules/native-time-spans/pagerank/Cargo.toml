[package]
name = "pagerank"
version = "0.1.0"
edition = "2021"
description = """
SeBS PageRank
"""

[lib]
name = "pagerank"
crate-type = ["rlib", "cdylib"]

[dependencies]
rand = "0.8"
pagerank-lib = { path = "../../shared/pagerank-lib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proxy-guest = { path = "../../shared/proxy-guest" }
