[package]
name = "compression"
version = "0.1.0"
edition = "2021"
description = """
SeBS Compression
"""

[lib]
name = "compression"
crate-type = ["rlib", "cdylib"]

[dependencies]
ureq = "3.2"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proxy-guest = { path = "../../shared/proxy-guest" }
