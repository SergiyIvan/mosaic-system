[package]
name = "dynamic-html"
version = "0.1.0"
edition = "2021"
description = """
SeBS Dynamic HTML
"""

[lib]
name = "dynamic_html"
crate-type = ["rlib", "cdylib"]

[dependencies]
rand = "0.8"
ureq = "3.2"
minijinja = "2.17.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proxy-guest = { path = "../../shared/proxy-guest" }
