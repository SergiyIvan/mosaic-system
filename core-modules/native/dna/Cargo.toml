[package]
name = "dna"
version = "0.1.0"
edition = "2021"
description = """
SeBS DNA
"""

[lib]
name = "dna"
crate-type = ["rlib", "cdylib"]

[dependencies]
ureq = "3.2"
squiggle-lib = { path = "../../shared/squiggle-lib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proxy-guest = { path = "../../shared/proxy-guest" }
