[package]
name = "classify"
version = "0.1.0"
edition = "2021"
description = """
SeBS Classify
"""

[lib]
name = "classify"
crate-type = ["rlib", "cdylib"]

[dependencies]
ureq = "3.2"
image = "0.25"
tract-onnx = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proxy-guest = { path = "../../shared/proxy-guest" }
